server:
  port: 8080
  
spring:
  application:
    name: finaegis-core-banking
    
  datasource:
    url: jdbc:mysql://localhost:3306/finaegis?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: ${DB_PASSWORD:password}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    show-sql: false
    
  flyway:
    enabled: true
    locations: classpath:db/migration
    
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      
  cache:
    type: redis
    redis:
      time-to-live: 300000  # 5 minutes
      
  jackson:
    serialization:
      write-dates-as-timestamps: false
      
axon:
  axonserver:
    servers: ${AXON_SERVER:localhost:8124}
  eventstore:
    jdbc:
      driver-class-name: com.mysql.cj.jdbc.Driver
      url: jdbc:mysql://localhost:3306/finaegis_events?useSSL=false&serverTimezone=UTC
      username: root
      password: ${DB_PASSWORD:password}
      
# JWT Configuration
jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-key-here-change-in-production}
  expiration: 3600000  # 1 hour in milliseconds
  refresh-expiration: 86400000  # 24 hours
  
# Application specific
finaegis:
  security:
    allowed-origins: http://localhost:3000,http://localhost:8080
  exchange:
    default-fee-percent: 0.1
  stablecoin:
    liquidation-threshold: 150
    min-collateral-ratio: 200
    
logging:
  level:
    com.finaegis: DEBUG
    org.axonframework: INFO
    
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
